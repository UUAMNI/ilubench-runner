# Release: on a version tag, build static ilubench binaries for macOS and
# Linux and attach them to a GitHub release. The tag becomes the version the
# binary reports (`ilubench --version`) and sends in its User-Agent.
#
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/UUAMNI/ilubench-runner/internal/cli.Version=${GITHUB_REF_NAME}" \
            -o "dist/ilubench-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}" ./cmd/ilubench
          (cd dist && sha256sum ilubench-* > "ilubench-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
