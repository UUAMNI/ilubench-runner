# Parity suite: holds every implementation to the characterization record of
# runner.py captured in parity/goldens. Milestone 0 runs only the Python side
# (proves the harness and catches Python-version drift); the Go binary is added
# in Milestone 2 of PORT_PLAN.md.
name: parity

on:
  push:
  pull_request:

jobs:
  python-characterization:
    name: runner.py vs goldens (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check runner.py against its own goldens
        run: python3 parity/harness.py check --impl python

  go-unit:
    name: Go vet + tests (with differential tests against runner.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -v 2>&1 | grep -E "^(---|ok|FAIL|PASS|\s+\w+_test.go)" 
